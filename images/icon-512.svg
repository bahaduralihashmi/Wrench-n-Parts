<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#dc3545" stroke-width="14"/>
  <!-- Wrench handle -->
  <line x1="130" y1="382" x2="382" y2="130" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <!-- Wrench head -->
  <circle cx="340" cy="152" r="58" fill="none" stroke="white" stroke-width="20"/>
  <circle cx="340" cy="152" r="26" fill="#1a1a2e"/>
  <!-- Wrench tail -->
  <circle cx="152" cy="360" r="36" fill="white"/>
  <!-- WN Text -->
  <text x="256" y="465" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="56" font-weight="bold">WN</text>
