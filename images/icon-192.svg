<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <circle cx="96" cy="96" r="90" fill="url(#bg)" stroke="#dc3545" stroke-width="6"/>
  <!-- Wrench handle -->
  <line x1="50" y1="142" x2="142" y2="50" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Wrench head -->
  <circle cx="126" cy="58" r="22" fill="none" stroke="white" stroke-width="8"/>
  <circle cx="126" cy="58" r="10" fill="#1a1a2e"/>
  <!-- Wrench tail -->
  <circle cx="58" cy="134" r="14" fill="white"/>
  <!-- WN Text -->
  <text x="96" y="175" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold">WN</text>
</svg>
