<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Wishlist — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("customer", "wishlist");
  const user = await WNP.requireRole(["customer"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.wishlist.list();
    const items = r.data.items || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">My Wishlist</h3>
      <div class="row g-3">${items.length ? items.map(p => `
        <div class="col-lg-3 col-md-4 col-6">
          <div class="card h-100">
            <a href="../product-detail.html?id=${p.product_id}"><img src="${p.product_image || '../images/no-image.png'}" class="card-img-top" onerror="this.src='../images/no-image.png'" style="height:180px;object-fit:cover"></a>
            <div class="card-body">
              <h6>${escapeHtml(p.product_name)}</h6>
              <div class="text-danger fw-bold">${WNP.money(p.discount_price || p.price)}</div>
              <button class="btn btn-sm btn-danger mt-2 w-100" onclick="add(${p.product_id})">Add to Cart</button>
            </div>
          </div>
        </div>`).join("") : `<div class="col-12 text-center text-muted py-5">No items in wishlist</div>`}</div>`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
async function add(id){ try{await WNP.api.cart.add(id,1);WNP.flash("Added","success");}catch(e){WNP.flash(e.message,"danger");} }
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
