<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Returns — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("customer", "returns");
  const user = await WNP.requireRole(["customer"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  out.innerHTML = `<h3 class="fw-bold mb-3">Returns</h3>
    <p class="text-muted">To request a return, go to <a href="orders.html">My Orders</a> and use the Return button. Admin will be notified.</p>`;
})();
</script>
</body>
</html>
