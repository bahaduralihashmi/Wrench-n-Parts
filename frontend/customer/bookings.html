<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bookings — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("customer", "bookings");
  const user = await WNP.requireRole(["customer"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.appointments.list();
    const items = r.data || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">My Bookings</h3>
      ${items.length ? `<div class="dash-table"><table class="table mb-0"><thead><tr><th>#</th><th>Workshop</th><th>Service</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr></thead>
      <tbody>${items.map(a => `<tr>
        <td>#${a.appointment_id}</td>
        <td>${escapeHtml(a.workshop_name || "")}</td>
        <td>${escapeHtml(a.service_type || "")}</td>
        <td>${escapeHtml(a.appointment_date || "")}</td>
        <td>${escapeHtml((a.appointment_time || "").substring(0,5))}</td>
        <td><span class="badge bg-info">${a.status}</span></td>
        <td>${a.status === 'pending' || a.status === 'approved' ? `<button class="btn btn-sm btn-outline-danger" onclick="cancel(${a.appointment_id})">Cancel</button>` : ''}</td>
      </tr>`).join("")}</tbody></table></div>` : `<p class="text-muted">No bookings yet. <a href="../workshop-finder.html">Find a workshop</a></p>`}`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
async function cancel(id){ try{await WNP.api.appointments.update(id,{status:"cancelled"});location.reload();}catch(e){WNP.flash(e.message,"danger");} }
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
