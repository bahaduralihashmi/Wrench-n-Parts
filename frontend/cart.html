<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cart — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="wnp-header"></div>
<section class="section-v2 py-4">
  <div class="container">
    <h2 class="fw-bold mb-3">Your Cart</h2>
    <div id="root"><div class="text-center py-4">Loading...</div></div>
  </div>
</section>
<div id="wnp-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script><script src="js/layout.js"></script>
<script>
(async function () {
  try {
    const r = await WNP.api.cart.list();
    const data = r.data;
    if (!data || !data.items || !data.items.length) {
      document.getElementById("root").innerHTML = `<div class="text-center py-5"><p class="text-muted">Your cart is empty.</p><a href="products.html" class="btn btn-danger">Browse Products</a></div>`;
      return;
    }
    document.getElementById("root").innerHTML = `
      <div class="row g-4">
        <div class="col-lg-8">${data.items.map(item).join("")}</div>
        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="fw-bold">Order Summary</h5>
              <hr>
              <div class="d-flex justify-content-between"><span>Items</span><strong>${data.count}</strong></div>
              <div class="d-flex justify-content-between fs-5 mt-2"><span>Total</span><strong class="text-danger">${WNP.money(data.total)}</strong></div>
              <a href="checkout.html" class="btn btn-danger w-100 mt-3">Proceed to Checkout</a>
              <button class="btn btn-outline-secondary w-100 mt-2" onclick="clearCart()">Clear Cart</button>
            </div>
          </div>
        </div>
      </div>`;
  } catch (e) {
    if (e.status === 401) { location.href = "login.html"; return; }
    document.getElementById("root").innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
  }
})();
function item(it) {
  const img = it.product_image || "images/no-image.png";
  return `
    <div class="card mb-2">
      <div class="card-body d-flex gap-3 align-items-center">
        <img src="${img}" style="width:80px;height:80px;object-fit:cover" onerror="this.src='images/no-image.png'">
        <div class="flex-grow-1">
          <a href="product-detail.html?id=${it.product_id}" class="fw-bold text-decoration-none text-dark">${escapeHtml(it.product_name)}</a>
          <div class="text-danger">${WNP.money(it.discount_price || it.price)}</div>
        </div>
        <input type="number" min="1" value="${it.quantity}" class="form-control" style="width:80px" onchange="updateQty(${it.product_id}, this.value)">
        <button class="btn btn-outline-danger btn-sm" onclick="removeItem(${it.product_id})"><i class="fas fa-trash"></i></button>
      </div>
    </div>`;
}
async function updateQty(pid, q) {
  try { await WNP.api.cart.update(pid, parseInt(q)); location.reload(); }
  catch (e) { WNP.flash(e.message, "danger"); }
}
async function removeItem(pid) {
  try { await WNP.api.cart.remove(pid); location.reload(); }
  catch (e) { WNP.flash(e.message, "danger"); }
}
async function clearCart() {
  if (!confirm("Clear all items?")) return;
  try { await WNP.api.cart.clear(); location.reload(); }
  catch (e) { WNP.flash(e.message, "danger"); }
}
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
