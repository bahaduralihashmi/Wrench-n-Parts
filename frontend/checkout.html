<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checkout — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="wnp-header"></div>
<section class="section-v2 py-4">
  <div class="container" style="max-width:720px">
    <h2 class="fw-bold mb-3">Checkout</h2>
    <div id="alert"></div>
    <form id="f" class="card card-body shadow-sm">
      <div class="mb-3"><label class="form-label">Shipping address</label><textarea class="form-control" name="shipping_address" rows="3" required></textarea></div>
      <div class="mb-3"><label class="form-label">Contact phone</label><input class="form-control" name="contact_phone" required></div>
      <div class="mb-3"><label class="form-label">Payment method</label>
        <select class="form-select" name="payment_method">
          <option value="cod">Cash on Delivery</option>
          <option value="card">Card</option>
          <option value="upi">UPI</option>
          <option value="netbanking">Net Banking</option>
        </select>
      </div>
      <div class="mb-3"><label class="form-label">Notes (optional)</label><textarea class="form-control" name="notes" rows="2"></textarea></div>
      <div id="summary" class="alert alert-info">Loading cart...</div>
      <button class="btn btn-danger btn-lg">Place Order</button>
    </form>
  </div>
</section>
<div id="wnp-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script><script src="js/layout.js"></script>
<script>
(async function () {
  try {
    const r = await WNP.api.cart.list();
    const d = r.data;
    document.getElementById("summary").textContent = `${d.count} items · Total ${WNP.money(d.total)}`;
  } catch (e) { if (e.status === 401) location.href = "login.html"; }
})();
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = Object.fromEntries(fd.entries());
  try {
    const r = await WNP.api.checkout(payload);
    WNP.flash("Order placed!", "success");
    location.href = "customer/orders.html";
  } catch (err) {
    document.getElementById("alert").innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
});
</script>
</body>
</html>
