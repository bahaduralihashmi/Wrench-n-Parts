<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shop Profile — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("shopkeeper", "profile");
  const user = await WNP.requireRole(["shopkeeper"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.shops.mine();
    const s = r.data;
    out.innerHTML = `<h3 class="fw-bold mb-3">My Shop</h3>
      <form id="f" class="card card-body shadow-sm" style="max-width:640px">
        <div class="mb-3"><label class="form-label">Shop name</label><input class="form-control" name="shop_name" value="${escapeHtml(s.shop_name || "")}" required></div>
        <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">${escapeHtml(s.description || "")}</textarea></div>
        <div class="mb-3"><label class="form-label">Location</label><input class="form-control" name="location" value="${escapeHtml(s.location || "")}"></div>
        <div class="mb-3"><label class="form-label">Contact</label><input class="form-control" name="contact" value="${escapeHtml(s.contact || "")}"></div>
        <div class="mb-3"><label class="form-label">Logo URL</label><input class="form-control" name="logo" value="${escapeHtml(s.logo || "")}"></div>
        <button class="btn btn-danger">Save</button>
      </form>`;
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try { await WNP.api.shops.updateMine(Object.fromEntries(fd.entries())); WNP.flash("Saved","success"); }
      catch (err) { WNP.flash(err.message, "danger"); }
    });
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
