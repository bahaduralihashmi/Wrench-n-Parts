<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("shopkeeper", "chat");
  const user = await WNP.requireRole(["shopkeeper"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.chat.threads();
    const items = r.data || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">Conversations</h3>
      ${items.length ? `<div class="dash-table"><table class="table mb-0"><thead><tr><th>From</th><th>Role</th><th>Last message</th><th>When</th></tr></thead>
      <tbody>${items.map(t => `<tr>
        <td>${escapeHtml(t.other_name || "")}</td>
        <td><span class="badge bg-info">${t.other_role || ""}</span></td>
        <td>${escapeHtml(t.last_message || "").substring(0,80)}</td>
        <td>${WNP.timeAgo(t.last_at)}</td>
      </tr>`).join("")}</tbody></table></div>` : `<p class="text-muted">No conversations</p>`}`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
