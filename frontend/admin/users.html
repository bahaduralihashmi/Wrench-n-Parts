<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Users — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("admin", "users");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.admin.users({ limit: 500 });
    const items = r.data || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">Users</h3>
      ${items.length ? `<div class="dash-table"><table class="table mb-0"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody>${items.map(u => `<tr>
        <td>${u.user_id}</td>
        <td>${escapeHtml(u.name)}</td>
        <td>${escapeHtml(u.email)}</td>
        <td><span class="badge bg-info">${u.role}</span></td>
        <td><span class="badge bg-${u.status==='active'?'success':u.status==='banned'?'danger':'warning'}">${u.status}</span></td>
        <td>${WNP.timeAgo(u.created_at)}</td>
        <td>
          <select class="form-select form-select-sm" onchange="setStatus(${u.user_id}, this.value)">
            ${['active','pending','inactive','banned','approved','rejected'].map(s => `<option value="${s}" ${u.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
          <button class="btn btn-sm btn-outline-danger mt-1" onclick="del(${u.user_id})">Delete</button>
        </td>
      </tr>`).join("")}</tbody></table></div>` : `<p class="text-muted">No users</p>`}`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
async function setStatus(id, s){ try{await WNP.api.admin.setUserStatus(id,s);WNP.flash("Updated","success");location.reload();}catch(e){WNP.flash(e.message,"danger");} }
async function del(id){ if(!confirm("Delete user?"))return; try{await WNP.api.admin.deleteUser(id);location.reload();}catch(e){WNP.flash(e.message,"danger");} }
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
