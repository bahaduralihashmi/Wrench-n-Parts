<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shops — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("admin", "shops");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.shops.list();
    const items = r.data || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">Shops</h3>
      ${items.length ? `<div class="dash-table"><table class="table mb-0"><thead><tr><th>ID</th><th>Name</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${items.map(s => `<tr>
        <td>${s.shop_id}</td>
        <td>${escapeHtml(s.shop_name)}</td>
        <td>${escapeHtml(s.location || "")}</td>
        <td><span class="badge bg-info">${s.status}</span></td>
        <td>${s.status==='pending'?`<button class="btn btn-sm btn-success" onclick="approve(${s.shop_id})">Approve</button> <button class="btn btn-sm btn-outline-danger" onclick="reject(${s.shop_id})">Reject</button>`:''}</td>
      </tr>`).join("")}</tbody></table></div>` : `<p class="text-muted">No shops</p>`}`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
async function approve(id){ try{await WNP.api.admin.approveShop(id);location.reload();}catch(e){WNP.flash(e.message,"danger");} }
async function reject(id){ try{await WNP.api.admin.rejectShop(id);location.reload();}catch(e){WNP.flash(e.message,"danger");} }
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
