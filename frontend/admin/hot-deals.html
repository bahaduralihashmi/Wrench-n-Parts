<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hot Deals — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("admin", "hot-deals");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.admin.hotDeals();
    const items = r.data || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">Hot Deals (by sales)</h3>
      <div class="row g-3">${items.map(p => `<div class="col-md-3 col-6"><div class="card"><img src="${p.product_image||'../images/no-image.png'}" onerror="this.src='../images/no-image.png'" class="card-img-top" style="height:160px;object-fit:cover"><div class="card-body"><h6>${escapeHtml(p.product_name)}</h6><div><strong class="text-danger">${WNP.money(p.discount_price || p.price)}</strong></div><small class="text-muted">Sold: ${p.sold || 0}</small></div></div></div>`).join("") || `<p class="text-muted">No data</p>`}</div>`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
