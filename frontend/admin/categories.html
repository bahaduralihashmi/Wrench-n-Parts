<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Categories — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("admin", "categories");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.categories.list();
    const items = r.data || [];
    out.innerHTML = `<div class="d-flex justify-content-between mb-3"><h3 class="fw-bold mb-0">Categories</h3><button class="btn btn-danger" onclick="newC()"><i class="fas fa-plus me-1"></i>New</button></div>
      <div class="dash-table"><table class="table mb-0"><thead><tr><th>ID</th><th>Name</th><th>Description</th><th></th></tr></thead>
      <tbody>${items.map(c => `<tr>
        <td>${c.category_id}</td>
        <td>${escapeHtml(c.category_name)}</td>
        <td>${escapeHtml(c.description || "")}</td>
        <td><button class="btn btn-sm btn-outline-danger" onclick="del(${c.category_id})">Delete</button></td>
      </tr>`).join("")}</tbody></table></div>`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
async function newC(){ const n=prompt("Category name:"); if(!n)return; const d=prompt("Description:")||""; try{await WNP.api.categories.create({category_name:n,description:d});location.reload();}catch(e){WNP.flash(e.message,"danger");} }
async function del(id){ if(!confirm("Delete?"))return; try{await WNP.api.categories.delete(id);location.reload();}catch(e){WNP.flash(e.message,"danger");} }
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
