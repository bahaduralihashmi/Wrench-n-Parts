<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Products — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("admin", "products");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.products.list({ limit: 500 });
    const items = r.data || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">Products (admin)</h3>
      ${items.length ? `<div class="dash-table"><table class="table mb-0"><thead><tr><th>ID</th><th>Name</th><th>Shop</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
      <tbody>${items.map(p => `<tr>
        <td>${p.product_id}</td>
        <td>${escapeHtml(p.product_name)}</td>
        <td>${escapeHtml(p.shop_name || "")}</td>
        <td>${WNP.money(p.price)}</td>
        <td>${p.stock}</td>
        <td><span class="badge bg-info">${p.status}</span></td>
        <td><button class="btn btn-sm btn-outline-danger" onclick="del(${p.product_id})">Delete</button></td>
      </tr>`).join("")}</tbody></table></div>` : `<p class="text-muted">No products</p>`}`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
async function del(id){ if(!confirm("Delete?"))return; try{await WNP.api.products.delete(id);location.reload();}catch(e){WNP.flash(e.message,"danger");} }
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
