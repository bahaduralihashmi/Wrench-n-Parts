<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feedback Review — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("admin", "feedback-review");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.management.feedback("pending");
    const items = r.data || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">Pending Chatbot Feedback</h3>
      ${items.length ? `<div class="dash-table p-3">${items.map(f => `<div class="border-bottom py-2">
        <div><strong>User:</strong> ${escapeHtml(f.message_sent)}</div>
        <div><strong>Bot:</strong> ${escapeHtml(f.response_given)}</div>
        <div><strong>Feedback:</strong> ${f.feedback === 1 ? "Helpful" : "Not helpful"}</div>
        <div class="mt-1">
          <button class="btn btn-sm btn-success" onclick="act(${f.id},'approved')">Approve</button>
          <button class="btn btn-sm btn-outline-danger" onclick="act(${f.id},'rejected')">Reject</button>
          <button class="btn btn-sm btn-outline-primary" onclick="act(${f.id},'added_to_kb')">Add to KB</button>
        </div>
      </div>`).join("")}</div>` : `<p class="text-muted">No pending feedback</p>`}`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
async function act(id, action){ try{await WNP.api.management.reviewFeedback(id, action);location.reload();}catch(e){WNP.flash(e.message,"danger");} }
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
