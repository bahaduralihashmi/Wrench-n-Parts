<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Appointments — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("workshop", "appointments");
  const user = await WNP.requireRole(["workshop"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.appointments.list();
    const items = r.data || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">Appointments</h3>
      ${items.length ? `<div class="dash-table"><table class="table mb-0"><thead><tr><th>#</th><th>Customer</th><th>Vehicle</th><th>Service</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${items.map(a => `<tr>
        <td>#${a.appointment_id}</td>
        <td>${escapeHtml(a.customer_name || "")}</td>
        <td>${escapeHtml((a.vehicle_make||"") + " " + (a.vehicle_model||"") + " " + (a.vehicle_year||""))}</td>
        <td>${escapeHtml(a.service_type || "")}</td>
        <td>${escapeHtml(a.appointment_date || "")} ${(a.appointment_time||"").substring(0,5)}</td>
        <td><span class="badge bg-info">${a.status}</span></td>
        <td>
          <select class="form-select form-select-sm" onchange="setStatus(${a.appointment_id}, this.value)">
            ${['pending','approved','in_progress','completed','cancelled'].map(s => `<option value="${s}" ${a.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </td>
      </tr>`).join("")}</tbody></table></div>` : `<p class="text-muted">No appointments</p>`}`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
async function setStatus(id, val){ try{await WNP.api.appointments.update(id,{status:val});WNP.flash("Updated","success");}catch(e){WNP.flash(e.message,"danger");} }
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
