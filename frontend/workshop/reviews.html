<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reviews — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("workshop", "reviews");
  const user = await WNP.requireRole(["workshop"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const me = await WNP.api.workshops.mine();
    const wid = me.data.workshop_id;
    const r = await WNP.api.reviews.list({ workshop_id: wid });
    const items = r.data || [];
    out.innerHTML = `<h3 class="fw-bold mb-3">Reviews (${(me.data.rating||"0.0")} ★ from ${me.data.total_reviews || 0} reviews)</h3>
      ${items.length ? `<div class="dash-table p-3">${items.map(rv => `<div class="border-bottom py-2"><strong>${escapeHtml(rv.user_name||"User")}</strong> · ${"★".repeat(rv.rating)}${"☆".repeat(5-rv.rating)}<div>${escapeHtml(rv.comment||"")}</div><small class="text-muted">${WNP.timeAgo(rv.created_at)}</small></div>`).join("")}</div>` : `<p class="text-muted">No reviews yet</p>`}`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
