<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
<style>
body { background: #f8f8f8; font-family: 'Segoe UI', -apple-system, sans-serif; margin: 0; }
.login-header { background: #fff; padding: 16px 0; border-bottom: 1px solid #eee; }
.login-container { max-width: 440px; margin: 40px auto; padding: 0 20px 60px; }
.login-badge { display: inline-block; background: #fff0f0; color: #dc3545; padding: 5px 14px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; margin-bottom: 16px; }
.login-title { font-size: 2rem; font-weight: 800; color: #1a1a2e; margin-bottom: 12px; }
.login-desc { color: #666; font-size: 0.92rem; margin-bottom: 32px; line-height: 1.6; }
.login-form-group { margin-bottom: 20px; }
.login-form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 6px; }
.login-form-group input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 0.9rem; }
.login-form-group input:focus { border-color: #dc3545; box-shadow: 0 0 0 3px rgba(220,53,69,0.1); outline: none; }
.login-submit-btn { width: 100%; padding: 14px; background: #dc3545; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
.login-submit-btn:hover { background: #c82333; }
.login-register-link { text-align: center; margin-top: 24px; font-size: 0.85rem; color: #666; }
.login-register-link a { color: #dc3545; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="login-header">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
      <img src="uploads/logo.png" alt="Logo" style="height:40px">
      <span style="font-weight:700">Wrench <span style="color:#dc3545;font-weight:800">n</span> Parts</span>
    </a>
    <a href="index.html" class="text-decoration-none text-muted small"><i class="fas fa-arrow-left"></i> Back to home</a>
  </div>
</div>

<div class="login-container">
  <span class="login-badge"><i class="fas fa-user me-1"></i> Sign in</span>
  <h1 class="login-title">Welcome back</h1>
  <p class="login-desc">Sign in to your account to continue.</p>

  <div id="loginAlert"></div>

  <form id="loginForm">
    <div class="login-form-group">
      <label>Email</label>
      <input type="email" name="email" required placeholder="Enter your email">
    </div>
    <div class="login-form-group">
      <label>Password</label>
      <input type="password" name="password" required placeholder="Enter your password">
    </div>
    <button type="submit" class="login-submit-btn">Login</button>
  </form>

  <div class="login-register-link">
    Don't have an account? <a href="register.html">Create an account</a> ·
    <a href="register-shopkeeper.html">Sell parts</a> ·
    <a href="register-workshop.html">Register workshop</a>
  </div>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const slot = document.getElementById("loginAlert");
  slot.innerHTML = "";
  try {
    const r = await WNP.api.auth.login(fd.get("email"), fd.get("password"));
    const data = r.data;
    location.href = data.redirect || "index.html";
  } catch (err) {
    slot.innerHTML = `<div class="alert alert-danger">${err.message || "Login failed"}</div>`;
  }
});

(async function () {
  try {
    const r = await WNP.api.auth.me();
    if (r.data) location.href = (r.data.role === "customer" ? "customer/dashboard.html" : r.data.role + "/dashboard.html");
  } catch (e) {}
})();
</script>
</body>
</html>
