<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Product — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="wnp-header"></div>
<section class="section-v2 py-4">
  <div class="container" id="root"><div class="text-center py-5">Loading...</div></div>
</section>
<div id="wnp-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script><script src="js/layout.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
(async function () {
  if (!id) { document.getElementById("root").innerHTML = "Missing id"; return; }
  try {
    const r = await WNP.api.products.get(id);
    const p = r.data;
    const img = p.product_image || "images/no-image.png";
    const price = p.discount_price
      ? `<span class="text-decoration-line-through text-muted fs-5">${WNP.money(p.price)}</span> <span class="fw-bold text-danger fs-3">${WNP.money(p.discount_price)}</span>`
      : `<span class="fw-bold text-danger fs-3">${WNP.money(p.price)}</span>`;
    document.getElementById("root").innerHTML = `
      <div class="row g-4">
        <div class="col-md-5"><img src="${img}" class="img-fluid rounded" onerror="this.src='images/no-image.png'"></div>
        <div class="col-md-7">
          <small class="text-muted">${escapeHtml(p.category_name || "")}</small>
          <h2 class="fw-bold">${escapeHtml(p.product_name)}</h2>
          <p class="text-muted">Brand: <strong>${escapeHtml(p.brand || "N/A")}</strong></p>
          <p>${escapeHtml(p.description || "")}</p>
          <div class="mb-3">${price}</div>
          <p>Stock: <span class="badge bg-${p.stock > 0 ? 'success' : 'secondary'}">${p.stock}</span></p>
          <div class="d-flex gap-2">
            <input type="number" min="1" value="1" id="qty" class="form-control" style="max-width:90px">
            <button class="btn btn-danger" onclick="addToCart(${p.product_id})"><i class="fas fa-cart-plus me-1"></i>Add to Cart</button>
            <button class="btn btn-outline-danger" onclick="toggleWishlist(${p.product_id})"><i class="fas fa-heart"></i></button>
          </div>
          <hr>
          <p class="small text-muted">Sold by: ${escapeHtml(p.shop_name || "N/A")}</p>
        </div>
      </div>
      <hr>
      <h4 class="fw-bold mt-4">Reviews</h4>
      <div id="reviews">Loading...</div>`;
    loadReviews();
  } catch (e) {
    document.getElementById("root").innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
  }
})();
async function loadReviews() {
  try {
    const r = await WNP.api.reviews.list({ product_id: id });
    const items = r.data || [];
    document.getElementById("reviews").innerHTML = items.length
      ? items.map(rv => `<div class="border rounded p-3 mb-2"><strong>${escapeHtml(rv.user_name || "User")}</strong> · ${"★".repeat(rv.rating)}${"☆".repeat(5-rv.rating)}<div>${escapeHtml(rv.comment || "")}</div><small class="text-muted">${WNP.timeAgo(rv.created_at)}</small></div>`).join("")
      : `<p class="text-muted">No reviews yet.</p>`;
  } catch (e) { document.getElementById("reviews").innerHTML = `<p class="text-muted">Failed to load reviews</p>`; }
}
async function addToCart(id) {
  const q = parseInt(document.getElementById("qty").value) || 1;
  try { await WNP.api.cart.add(id, q); WNP.flash("Added to cart", "success"); WNP.refreshCartCount(); }
  catch (e) { if (e.status === 401) location.href = "login.html"; else WNP.flash(e.message, "danger"); }
}
async function toggleWishlist(id) {
  try {
    const ids = (await WNP.api.wishlist.ids()).data || [];
    if (ids.includes(id)) { await WNP.api.wishlist.remove(id); WNP.flash("Removed from wishlist", "info"); }
    else { await WNP.api.wishlist.add(id); WNP.flash("Added to wishlist", "success"); }
  } catch (e) { if (e.status === 401) location.href = "login.html"; }
}
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
