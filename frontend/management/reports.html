<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reports — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("management", "reports");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.management.reports();
    const d = r.data;
    out.innerHTML = `<div class="row g-3">
      <div class="col-md-3"><div class="card-stat"><small class="text-muted">Total revenue</small><h3>${WNP.money(d.total_revenue)}</h3></div></div>
      <div class="col-md-3"><div class="card-stat"><small class="text-muted">Avg order value</small><h3>${WNP.money(d.average_order_value)}</h3></div></div>
      <div class="col-md-3"><div class="card-stat"><small class="text-muted">Orders</small><h3>${d.total_orders}</h3></div></div>
      <div class="col-md-3"><div class="card-stat"><small class="text-muted">Cancelled</small><h3>${d.cancelled_orders}</h3></div></div>
    </div>`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
</script>
</body>
</html>
