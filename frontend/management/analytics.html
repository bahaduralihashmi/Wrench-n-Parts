<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Analytics — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("management", "analytics");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.management.analytics();
    const d = r.data;
    out.innerHTML = `<div class="row g-3">
      <div class="col-md-4"><div class="card-stat"><small class="text-muted">Total Revenue</small><h3>${WNP.money(d.revenue_total)}</h3></div></div>
      <div class="col-md-8"><div class="card p-3"><h5 class="fw-bold">Orders by status</h5>${Object.entries(d.orders_by_status).map(([k,v]) => `<span class="badge bg-info me-1">${k}: ${v}</span>`).join("")}</div></div>
      <div class="col-12"><div class="card p-3"><h5 class="fw-bold">Top categories</h5>
        <table class="table table-sm"><thead><tr><th>Category</th><th>Sold</th></tr></thead>
        <tbody>${(d.top_categories||[]).map(c => `<tr><td>${escapeHtml(c.category)}</td><td>${c.sold}</td></tr>`).join("")}</tbody></table>
      </div></div>
    </div>`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
