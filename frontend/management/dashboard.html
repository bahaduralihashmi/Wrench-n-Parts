<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Management Dashboard — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("management", "dashboard");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.management.dashboard();
    const d = r.data;
    out.innerHTML = `<div class="row g-3">
      ${[
        ["Shops", d.total_shops, "primary"],
        ["Active shops", d.active_shops, "success"],
        ["Workshops", d.total_workshops, "primary"],
        ["Active workshops", d.active_workshops, "success"],
        ["Products", d.total_products, "info"],
        ["Categories", d.total_categories, "info"],
        ["Orders", d.total_orders, "warning"],
        ["Pending orders", d.pending_orders, "warning"],
        ["Appointments", d.total_appointments, "secondary"],
        ["Pending feedback", d.pending_feedback, "danger"],
        ["Pending KB review", d.pending_kb_review, "danger"],
      ].map(([l,v,c]) => `<div class="col-md-3"><div class="card-stat"><small class="text-muted">${l}</small><h3 class="text-${c}">${v}</h3></div></div>`).join("")}
    </div>`;
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
</script>
</body>
</html>
