<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script src="../js/app.js"></script><script src="../js/dashboard.js"></script>
<script>
(async function () {
  document.getElementById("root").innerHTML = WNP.renderDashboard("management", "profile");
  const user = await WNP.requireRole(["admin", "management"]);
  if (!user) return;
  const out = document.getElementById("dashContent");
  try {
    const r = await WNP.api.profile.get();
    const u = r.data;
    out.innerHTML = `<h3 class="fw-bold mb-3">Profile</h3>
      <form id="f" class="card card-body shadow-sm" style="max-width:520px">
        <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" value="${escapeHtml(u.name||"")}"></div>
        <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone" value="${escapeHtml(u.phone||"")}"></div>
        <button class="btn btn-danger">Save</button>
      </form>`;
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try { await WNP.api.profile.update(Object.fromEntries(fd.entries())); WNP.flash("Saved","success"); }
      catch (err) { WNP.flash(err.message,"danger"); }
    });
  } catch (e) { out.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
})();
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
