<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
<style>
body { background: #f8f8f8; font-family: 'Segoe UI', -apple-system, sans-serif; margin: 0; }
.login-container { max-width: 460px; margin: 30px auto; padding: 0 20px 60px; }
.login-form-group { margin-bottom: 16px; }
.login-form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 6px; }
.login-form-group input, .login-form-group textarea { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 0.9rem; }
.login-form-group input:focus, .login-form-group textarea:focus { border-color: #dc3545; box-shadow: 0 0 0 3px rgba(220,53,69,0.1); outline: none; }
.login-submit-btn { width: 100%; padding: 14px; background: #dc3545; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div id="wnp-header"></div>

<div class="login-container">
  <span class="login-badge" style="display:inline-block;background:#fff0f0;color:#dc3545;padding:5px 14px;border-radius:50px;font-size:0.75rem;font-weight:600;margin-bottom:16px"><i class="fas fa-user me-1"></i> Customer</span>
  <h1 style="font-size:1.9rem;font-weight:800;color:#1a1a2e;margin-bottom:12px">Create an account</h1>
  <p style="color:#666;margin-bottom:24px">Sign up to track orders, manage wishlist, and book services.</p>
  <div id="regAlert"></div>
  <form id="regForm">
    <div class="login-form-group"><label>Full name</label><input name="name" required></div>
    <div class="login-form-group"><label>Email</label><input type="email" name="email" required></div>
    <div class="login-form-group"><label>Password</label><input type="password" name="password" minlength="6" required></div>
    <div class="login-form-group"><label>Phone</label><input name="phone"></div>
    <div class="login-form-group"><label>Address</label><textarea name="address" rows="2"></textarea></div>
    <button class="login-submit-btn">Create account</button>
  </form>
  <p class="text-center mt-3 small">Already have an account? <a href="login.html">Login</a></p>
</div>

<div id="wnp-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById("regForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = { name: fd.get("name"), email: fd.get("email"), password: fd.get("password"), phone: fd.get("phone"), address: fd.get("address"), role: "customer" };
  try {
    const r = await WNP.api.auth.register(payload);
    location.href = (r.data && r.data.redirect) || "customer/dashboard.html";
  } catch (err) {
    document.getElementById("regAlert").innerHTML = `<div class="alert alert-danger">${err.message || "Failed"}</div>`;
  }
});
</script>
</body>
</html>
