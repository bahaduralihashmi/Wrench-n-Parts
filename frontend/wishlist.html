<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wishlist — Wrench n Parts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="wnp-header"></div>
<section class="section-v2 py-4">
  <div class="container">
    <h2 class="fw-bold mb-3">Your Wishlist</h2>
    <div id="root" class="row g-3"><div class="col-12 text-center py-5">Loading...</div></div>
  </div>
</section>
<div id="wnp-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script><script src="js/layout.js"></script>
<script>
(async function () {
  try {
    const r = await WNP.api.wishlist.list();
    const items = r.data.items || [];
    if (!items.length) { document.getElementById("root").innerHTML = `<div class="col-12 text-center py-5"><p class="text-muted">Your wishlist is empty</p><a href="products.html" class="btn btn-danger">Browse</a></div>`; return; }
    document.getElementById("root").innerHTML = items.map(p => `
      <div class="col-lg-3 col-md-4 col-6">
        <div class="card h-100">
          <a href="product-detail.html?id=${p.product_id}"><img src="${p.product_image || 'images/no-image.png'}" class="card-img-top" onerror="this.src='images/no-image.png'" style="height:180px;object-fit:cover"></a>
          <div class="card-body">
            <h6 class="card-title">${escapeHtml(p.product_name)}</h6>
            <div class="text-danger fw-bold">${WNP.money(p.discount_price || p.price)}</div>
            <div class="d-flex gap-2 mt-2">
              <button class="btn btn-sm btn-danger flex-grow-1" onclick="WNP_add(${p.product_id})">Add to Cart</button>
              <button class="btn btn-sm btn-outline-danger" onclick="WNP_remove(${p.product_id})"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
      </div>`).join("");
  } catch (e) { if (e.status === 401) location.href = "login.html"; }
})();
async function WNP_add(id){ try{await WNP.api.cart.add(id,1);WNP.flash("Added","success");WNP.refreshCartCount();}catch(e){WNP.flash(e.message,"danger");} }
async function WNP_remove(id){ try{await WNP.api.wishlist.remove(id);location.reload();}catch(e){WNP.flash(e.message,"danger");} }
function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
